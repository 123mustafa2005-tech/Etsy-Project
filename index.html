<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h2>Etsy</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search for handmade items...">
            <button>🔍</button>
        </div>

        <div class="header-links">
            <a href="#">Categories</a>
            <a href="#">Favorites</a>
            <a href="#">Sign In</a>
            <a href="#">❤</a>
            <a href="#">🛒</a>
        </div>

    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Unique Handmade Products</h1>
            <p>Shop creative gifts, decorations and fashion items.</p>
            <button>Shop Now</button>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories">
        <h2>Popular Categories</h2>

        <div class="category-container">

            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1517705008128-361805f42e86?w=500" alt="">
                <h3>Home Decor</h3>
            </div>

            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="">
                <h3>Accessories</h3>
            </div>

            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500" alt="">
                <h3>Fashion</h3>
            </div>

            <div class="category-card">
                <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=500" alt="">
                <h3>Clothing</h3>
            </div>

        </div>
    </section>

    <!-- Products -->
    <section class="products">
        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="">
                <h3>Stylish Shoes</h3>
                <p>$25</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="">
                <h3>Cool T-Shirt</h3>
                <p>$18</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="">
                <h3>Watch</h3>
                <p>$35</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500" alt="">
                <h3>Backpack</h3>
                <p>$30</p>
            </div>

        </div>
    </section>

    

</body>
</html>
